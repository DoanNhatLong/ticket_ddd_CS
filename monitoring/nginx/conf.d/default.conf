# Entry point of TrainBooking: nginx spreads /api/ requests over two API copies
# that run on the host (dotnet run, profiles "http" and "http-2").

# Docker's DNS. host.docker.internal has an IPv4 and an IPv6 address, but the IPv6 one
# cannot be reached from this container; without ipv6=off nginx would see 4 servers
# (2 of them always failing) instead of 2.
resolver 127.0.0.11 ipv6=off valid=30s;

upstream trainbooking_api {
    # Shared memory needed by "resolve" (names are looked up again while running).
    zone trainbooking_api 64k;

    # Round-robin by default. After 1 failed attempt a server is skipped for 10 s.
    server host.docker.internal:7777 resolve max_fails=1 fail_timeout=10s;  # api-1
    server host.docker.internal:7778 resolve max_fails=1 fail_timeout=10s;  # api-2

    # Reuse connections to the API instead of opening one per request.
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://trainbooking_api;

        # Needed for upstream keepalive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A copy that is down is noticed quickly.
        proxy_connect_timeout 2s;

        # Try the other copy when one cannot be reached. nginx never retries POST
        # (non-idempotent) on its own, so a booking cannot be created twice.
        proxy_next_upstream error timeout;

        # Shows which API copy answered (for learning/debugging).
        add_header X-Upstream $upstream_addr always;
    }

    # Default nginx page for now; the built web app will be served here later.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
