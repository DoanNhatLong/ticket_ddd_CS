# Reads the JSON log files written by TrainBooking.Api and sends them to Elasticsearch.

input {
  file {
    path => "/logs/trainbooking-*.json"
    start_position => "beginning"
    # Remembers how far each file was read (kept in the logstash_data volume).
    sincedb_path => "/usr/share/logstash/data/sincedb_trainbooking"
  }
}

filter {
  # Same line, same id: reading a file twice cannot create duplicates.
  fingerprint {
    source => "message"
    target => "[@metadata][id]"
    method => "SHA256"
  }

  json {
    source => "message"
    target => "log"
  }

  if "_jsonparsefailure" not in [tags] {
    # Serilog compact JSON: @t time, @m message, @l level (absent = Information), @x exception, @tr trace id.
    date {
      match => ["[log][@t]", "ISO8601"]
    }

    mutate {
      replace => { "message" => "%{[log][@m]}" }
      rename => {
        "[log][@l]" => "level"
        "[log][@x]" => "exception"
        "[log][@tr]" => "traceId"
        "[log][SourceContext]" => "source"
        "[log][Application]" => "application"
        "[log][Instance]" => "instance"
        "[log][RequestMethod]" => "requestMethod"
        "[log][RequestPath]" => "requestPath"
        "[log][StatusCode]" => "statusCode"
        "[log][Elapsed]" => "elapsedMs"
        "[log][RequestId]" => "requestId"
      }
      remove_field => ["[log][@t]", "[log][@m]", "[log][@i]", "[log][@sp]"]
    }

    if ![level] {
      mutate { add_field => { "level" => "Information" } }
    }
  }

  mutate {
    remove_field => ["host", "path", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # A data stream: fields and retention come from the index template
    # (monitoring/elasticsearch/trainbooking-logs-template.json).
    index => "logs-trainbooking-default"
    action => "create"
    document_id => "%{[@metadata][id]}"
    data_stream => false
    manage_template => false
    ilm_enabled => false
  }
}
