version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: train_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set, copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-0test1}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  grafana:
    image: grafana/grafana:latest
    container_name: train_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD is not set, copy .env.example to .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: train_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
  redis:
    image: redis:7.4-alpine
    container_name: train_redis
    # Host port 6380 because 6379 is already used by a native Redis on the dev machine.
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  redis_data: