version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: train_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set, copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-0test1}
      # Used by monitoring/mysql/create-exporter-user.sh to create the 'exporter' user.
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is not set, copy .env.example to .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./monitoring/mysql/create-exporter-user.sh:/docker-entrypoint-initdb.d/create-exporter-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: train_mysqld_exporter
    # No host port: only Prometheus (same compose network) scrapes mysqld-exporter:9104.
    command:
      - "--mysqld.address=mysql-db:3306"
      - "--mysqld.username=exporter"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is not set, copy .env.example to .env}
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: always
  grafana:
    image: grafana/grafana:latest
    container_name: train_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD is not set, copy .env.example to .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: train_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
  redis:
    image: redis:7.4-alpine
    container_name: train_redis
    # Host port 6380 because 6379 is already used by a native Redis on the dev machine.
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: train_redis_exporter
    # No host port: only Prometheus (same compose network) scrapes redis-exporter:9121.
    # Redis has no password; if requirepass is enabled later, pass REDIS_PASSWORD from .env.
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: always
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: train_elasticsearch
    # Development only: single node, security disabled (no user/password, plain HTTP).
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
  kibana:
    # Must be the same version as Elasticsearch.
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: train_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TELEMETRY_OPTIN=false
      - NODE_OPTIONS=--max-old-space-size=1024
    ports:
      # This machine only: Kibana has no login while Elasticsearch security is disabled.
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -o /dev/null http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy
    # unless-stopped: stays off after "docker compose stop kibana", even when Docker restarts.
    restart: unless-stopped
  elasticsearch-setup:
    # Runs once and exits: registers the fields and the 7-day retention of the log data stream.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: train_elasticsearch_setup
    entrypoint: ["curl", "-sS", "-f", "-X", "PUT"]
    command:
      - "http://elasticsearch:9200/_index_template/logs-trainbooking"
      - "-H"
      - "Content-Type: application/json"
      - "--data-binary"
      - "@/setup/trainbooking-logs-template.json"
    volumes:
      - ./monitoring/elasticsearch:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
  logstash:
    # Must be the same version as Elasticsearch. No host port: it only reads ./logs.
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: train_logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - PIPELINE_WORKERS=1
      - PIPELINE_ECS_COMPATIBILITY=disabled
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/logs:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
    restart: unless-stopped
  nginx:
    # Reverse proxy entry point: spreads /api/ over two API copies on the host (7777, 7778).
    image: nginx:1.27-alpine
    container_name: train_nginx
    ports:
      - "8080:80"
    volumes:
      - ./monitoring/nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      # Lets nginx reach the API that runs on the host (http://host.docker.internal:7777).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  logstash_data:
  mysql_data:
  prometheus_data:
  grafana_data:
  redis_data:
  es_data: